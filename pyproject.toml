[project]
name = "tick-research"
version = "0.1.0"
description = "Public market data capture for wick research (v0: raw append log + density stats)"
requires-python = ">=3.14"  # compression.zstd is stdlib from 3.14
dependencies = [
    "orjson>=3.13.0",
    "pyarrow>=26.0.0",
    "uvloop>=0.23.0",
    "websockets>=14",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
